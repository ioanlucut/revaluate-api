# Postgres plus the API, configured for the "local" environment
# (see core/src/main/resources/installation_local.properties).
#   docker compose up --build        everything
#   docker compose up -d postgres    just the database, for running the API from an IDE
services:
  postgres:
    image: postgres:9.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Point both the Dropwizard (dw.*) and the Spring (db.*) data sources at the compose database.
      JAVA_OPTS: >-
        -Ddw.database.url=jdbc:postgresql://postgres/postgres
        -Ddb.url=jdbc:postgresql://postgres/postgres
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
